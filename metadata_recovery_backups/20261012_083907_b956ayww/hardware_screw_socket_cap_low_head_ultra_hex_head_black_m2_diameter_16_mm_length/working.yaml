            \ layout \u2192 line and manufacturing spec \u2192 exclusions last.\n\n\
            **Length: 180\u2013250 words.** Long enough to carry the full spec, short\
            \ enough that no single instruction gets diluted. If you are over, cut\
            \ adjectives and repeated style words before you cut any manufacturing\
            \ rule.\n\nHard requirements for that prompt:\n\n- It opens by stating\
            \ it is a **square black-and-white line-art mascot logo**.\n- It says\
            \ in plain words that the image is **square** and **pure black on a pure\
