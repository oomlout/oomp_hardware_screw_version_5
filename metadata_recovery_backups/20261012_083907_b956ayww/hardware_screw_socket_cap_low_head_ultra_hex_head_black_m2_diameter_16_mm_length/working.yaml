            \ Cut any prop that is decoration rather than signal.\n- **Text:** one\
            \ line \u2014 the exact string in quotes with exact casing, or \"no text\"\
            . Text is optional and a clean wordless mark often wins.\n- **Trace and\
            \ small-size check:** a short bullet list of fixes only \u2014 every stroke\
            \ to thicken, gap to widen, island to bridge, detail to delete. Just the\
            \ fixes, not the reasoning, and not a description of what the design looks\
            \ like at size.\n\nSkip anything not on that list: no tradeoff essays,\
