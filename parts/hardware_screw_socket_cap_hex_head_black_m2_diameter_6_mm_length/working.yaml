                    specifications: Product information High tensile Socket head cap
                        screws, made of 12.9 tensile steel with self colour finish
                        to Din 912 with metric coarse thread. Also known as a socket
                        head cap screw, socket screw or Allen bolt. This is a cap
                        screw with a hexagonal recessed drive. A hex key, sometimes
                        referred to as an Allen wrench or Allen key, or hex driver
                        is required to tighten or loosen a socket screw. Socket screws
                        are commonly used in assemblies that don't provide sufficient
                        clearance for a conventional wrench or spanner. Please note
                        that not all socket caps are fully threaded. If thread length
                        is critical please contact us for more info.
