                                    range of Cap Screws are manufactured in accordance
                                    with industry standards, such as DIN 912 and ISO
                                    4762. Screws within this range are available in
                                    either a fully threaded or partially threaded
                                    form, with the latter featuring an unthreaded
                                    portion below the head of the screw. The distinction
                                    of whether the screw is fully threaded or not
                                    is detailed in each individual product specification.
                                    If a larger unthreaded portion is required, Accu''s
                                    range of Socket Shoulder Screws range may be more
