    modelling_choices:
        catalogue_length: Conservative extension label for every length; comparable
            dimension tables do not establish Screw-Tite stock availability.
        certification: Similar-product visualization only; does not identify the stocked
            product or certify DIN conformity.
        display: Smooth pointed thread envelope tapering into the slender plain shank;
            same recessed head.
        head: HSB nominal/midpoint head diameter and published head/neck clearance.
            Selected 90 degree cone, 0.10d rim, small fillet and a slender cylindrical
            neck; head-to-thread clearance is shortened only on tiny catalogue extensions.
        identity: Modern chipboard/plywood screw proxy requested by user; slim shank
            with 40 degree wood threads. Screw-Tite remains the preferred comparison;
            its exact Tri-Lock, ribs and twin-start transition are not reproduced.
        markings: Unidentified manufacturer and property-class stamps omitted.
        recess: Motu modern chipboard table supplies Pozidriv mouth and midpoint penetration
            at 2.5-6 mm; 2 mm retains the similar-head DIN 965 Z1 mouth/depth proxy.
            ISO 4757 wing/taper visual cavity, not a gauge model.
        runout: Selected one-pitch fade into a smooth shank; limited to one third
            of the threaded envelope on very short entries.
        small_sizes: 2.5 mm head/core/shank/pitch use Motu dimensions (shank uses
            wire diameter). 2 mm head/core/shank are scaled from 2.5 mm, with separately
            published 0.9 mm small wood-thread pitch and DIN 965 Z1 recess. Only the
            2 mm profile is a scaled dimensional extension.
        thread: HSB modern chipboard core midpoints and nominal pitch, 40 degree flanks,
            selected 0.02P crest land. Plain shank uses published minimum diameter,
            independently of the thread crest.
        thread_coverage: User requests a bare section below every head. Target b=0.6L,
            capped at 72 mm, plus a one-pitch runout. Reserve a plain shank of at
            least min(0.5d, 25% of available shaft), shortening the thread on tiny
            catalogue lengths. Coverage is an explicit visualization choice; actual
            Screw-Tite products vary.
        tip: Selected point length 1.25 diameters, shortened to 60% of the threaded
            envelope on short extensions. This approximates a plain sharp chipboard
            point; cutting flutes and serrations omitted.
    note: Similar-product modern chipboard/plywood screw visualization; not an exact
        Screw-Tite model or certified DIN part.
