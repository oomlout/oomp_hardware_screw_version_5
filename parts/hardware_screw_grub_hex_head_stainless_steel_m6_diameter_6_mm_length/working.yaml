    modelling_choices:
        catalogue_length: Unlisted lengths use the sourced size profile at the catalogue
            length and are explicitly marked as extensions.
        certification: Nominal catalogue geometry; not manufacturing certification.
        display: Smooth nominal thread envelope with the same head and recessed drive.
        end: Socket-end face diameter uses the nominal external thread minor diameter
            with a 45 degree chamfer. Manufacturer marks and socket drill-tip detail
            are omitted.
        identity: User confirmed cup point DIN 916 / ISO 4029 on 2026-10-11.
        markings: Unidentified manufacturer and property-class stamps omitted.
        point: Cup diameter uses the middle of the published dv range. A selected
            0.025 mm radial annular land prevents a zero-width edge; the concavity
            uses a 120 degree cone.
        runout: Thread envelope terminates at the 45 degree cup bevel and socket-end
            chamfer.
        socket: Minimum published t for the applicable short/long length category;
            flat floor is a visualization choice.
        thread: Nominal right-hand external metric profile; 60 degree flanks, H/6
            rounded root; no ISO 965 tolerance offsets.
        tip: Concave 120 degree cup with a small selected annular land and 45 degree
            outer bevel.
