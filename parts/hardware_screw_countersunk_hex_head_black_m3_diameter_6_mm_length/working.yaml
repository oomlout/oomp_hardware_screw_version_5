                    box_quantity: ''
                    captured_at: '2026-10-11T23:27:02.776839+00:00'
                    currency: GBP
                    description: 'Countersunk Socket Head Screws feature a countersunk
                        head type, which allows them to sit flush with their target
                        housing. The socket head of these screws makes them ideal
                        for use alongside Accu’s Hex Drive Bits or Allen Keys & Wrenches.
                        Countersunk Screws are designed to be used alongside pre-drilled
                        countersunk recesses, which can be made with the use of angle
                        cutters called countersinks.  Countersunk Captive Fasteners
                        Captive screw variants of Accu''s Metric Countersunk Screws
                        are available in A2 and A4 Stainless Steel, with other materials
                        such as thermoplastic PEEK available on request. Our range
                        of Socket Countersunk Captive Screws are designed to be used
                        in conjunction with Captive Washers to prevent the screws
                        from falling out of housing assemblies and conform to EU Safety
                        regulations. Materials Countersunk Socket Head Screws can
                        be manufactured from a range of materials, including A2 and
                        A4 Stainless Steel, Bumax and Aluminium options as standard.
                        Accu also supplies Socket Countersunk Screws in 10.9 and 12.9
                        High Tensile Steel, with materials such as Titanium and PEEK
                        available through our custom manufacture service. Enhance
                        the security of your Metric Socket Countersunk Screws against
                        vibrations and self-loosening with our pre-applied thread-locking
                        solutions. Choose from AccuLock Threadlocker for essential
                        fastening, Anu-Lok 180 for added robustness, or Precote 80
                        for high-performance locking. Elevate the aesthetics of your
                        components with AccuBlack chemical blackening, reducing reflections
                        and delivering a premium finish. Security Screw Variant For
                        applications requiring a tamper-proof drive, this component
                        is also available in a security variant, which can be found
                        in Accu''s Security Socket Countersunk Screws range.  Metric
                        Sizes Accu’s Metric Socket Countersunk Screws are available
                        in thread sizes ranging from M2 to M24, and lengths from 3mm
                        up to 200mm. Imperial Sizes Imperial Countersunk Socket Screws
                        are also available in diameters from #0 to 7/8 inch. Lengths
                        are available from 1/8 inch up to 10 inches. Minimum Thread
                        Length In accordance with DIN standard 7991, Accu''s Socket
                        Countersunk Screws are manufactured to a minimum specified
                        thread length. Please contact us before placing your order
                        if this dimension is critical to your application.'
