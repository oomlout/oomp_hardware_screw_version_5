        url: https://www.tme.eu/Document/6dcfa6f98cf6e40290aa56258c19b5d6/BN384.pdf
        use: DIN head maximum diameter and height, H recess and fully threaded commercial
            products.
    -   title: Bossard BN 3311 Pozidriv pan-head dimension table
        url: https://www.tme.eu/Document/193f9ad1cddd45cf9c89db8245477de8/BN3311-DE.pdf
        use: Z recess dimensions.
    -   title: DIN 7985:1990 original Table 1, hosted by Shenzhen Fine Technology
        url: https://www.finesz.com/pic/DIN7985.pdf
        use: M3.5 Z recess m=4, t=1.65 to 2.11; approximate head crown radii rf and
            under-head radius bounds. Handwritten alterations in this scan are ignored.
    -   title: ISO 4757:1983, clauses 2 and 3, H and Z dimension tables and sections
        url: https://cdn.standards.iteh.ai/samples/10742/d878fa0371e041b39de75de4d4426928/ISO-4757-1983.pdf
        use: Wing width f selected at the middle of the tolerance band, centre width
            b at its nominal value, outer wing slope 26 degrees 30 minutes, floor
            cone 28 degrees. Simplified visualization rather than a gauge-certified
            punch.
