                        you need is now in hand — do not ask questions, just work.


                        ---


                        ## Part A — exploration


                        **Budget: about 450 words, 600 hard ceiling.** Push past the
                        theme''s first obvious reading, but do it briskly. No preamble,
                        no restating the theme back at me.


                        - **Angles:** exactly four mascot interpretations, **one or
                        two sentences each**. Include at least one that anthropomorphises
                        an object or concept from the theme rather than reaching for
