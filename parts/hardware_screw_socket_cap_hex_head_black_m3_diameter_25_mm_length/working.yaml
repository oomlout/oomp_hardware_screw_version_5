                        use of an allen key to tighten them. Ideal for use where there
                        is not enough clearance to use a Hex Head Bolt. Suitable for
                        applications where high strength is required due to the high
                        tensile strength. These screws are partially threaded as standard
                        after a certain length. Please note that these bolts offer
                        little to no protection from rusting and are more suited for
                        indoor use or for applications where they are protected from
                        moisture.'
