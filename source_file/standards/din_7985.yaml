schema_version: 1
standard: DIN 7985 A
title: DIN 7985 pan-head machine screws with H or Z recess
units: mm
head_style: pan
length_convention: under_head
checked_on: '2026-10-11'
sources:
- title: Bossard BN 384 Phillips pan-head dimension table
  url: https://www.tme.eu/Document/6dcfa6f98cf6e40290aa56258c19b5d6/BN384.pdf
  use: DIN head maximum diameter and height, H recess and fully threaded commercial
    products.
- title: Bossard BN 3311 Pozidriv pan-head dimension table
  url: https://www.tme.eu/Document/193f9ad1cddd45cf9c89db8245477de8/BN3311-DE.pdf
  use: Z recess dimensions.
- title: DIN 7985:1990 original Table 1, hosted by Shenzhen Fine Technology
  url: https://www.finesz.com/pic/DIN7985.pdf
  use: M3.5 Z recess m=4, t=1.65 to 2.11; approximate head crown radii rf and under-head
    radius bounds. Handwritten alterations in this scan are ignored.
modelling_choices:
  head: Pan profile uses the published approximate spherical crown radius rf over
    a cylindrical skirt; k and dk use the supplier maximum dimensions. The recess
    removes the theoretical crown apex. Head edge die-flow rounding is omitted.
  thread_coverage: Full thread to head follows the Bossard product descriptions. Longer
    catalogue entries are marked as extensions.
  material: Empty finish labels use a satin steel visual placeholder; this does not
    identify the actual product finish.
