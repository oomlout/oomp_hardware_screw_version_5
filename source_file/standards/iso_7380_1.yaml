schema_version: 1
standard: ISO 7380-1:2022
title: Hexagon socket button head screws
units: mm
checked_on: '2026-10-11'
head_style: button
length_convention: under_head
sources:
  - title: ISO 7380-1:2022 scope
    url: https://www.iso.org/standard/78699.html
    use: M3–M16; M2 and M2.5 are outside ISO scope.
  - title: Bossard BN 19 manufacturer dimensional table
    url: https://xonstorage.z8.web.core.windows.net/pdf/bossard_1805681_xonlink.pdf
    use: dk, k, s, t, commercial miniature rows, and note that partial threading cannot always be guaranteed.
modelling_choices:
  reference: Published Bossard nominal head/socket dimensions; manufacturer of catalogue parts remains unspecified.
  head: Spherical segment terminating at a flat crown of nominal shaft diameter; narrow lower rim and tangent underhead fillet are explicit profile choices.
  socket: Nominal key width and minimum penetration; flat bottom and circular mouth countersink.
  thread_coverage: Full by default; Bossard warns that the partially threaded version cannot always be guaranteed. Store an explicit per-part override when identified.
