schema_version: 1
standard: Japanese Screws JCIS Type 3 supplier reference
title: M1.4 large countersunk cross-recess machine screw, nominal supplier profile
units: mm
head_style: countersunk
length_convention: overall
checked_on: '2026-10-12'
sources:
  - title: Heads & All Threads Japanese Screws brochure, printed page 5, Type 3 M1.4
    url: https://prokcssmedia.blob.core.windows.net/sys-master-images/h22/hd6/9138373263390/JAP%20SCREWS%20Brochure.pdf
    local_file: references/japanese_screws_brochure.pdf
    use: Pitch, nominal head diameter and height, 90 degree cone, recess mouth and penetration limits. Visually checked on PDF page 3 (printed page 5).
modelling_choices:
  identity: Selected supplier reference for visualization; the catalogue does not identify its manufacturer. This is not DIN 965 and is not a measured match to stocked screws.
  head: Type 3 large head, nominal D and H; selected 0.04 mm underhead fillet and derived positive rim.
  thread_coverage: Full nominal metric thread to the head; no supplier-specific runout claimed.
  recess: Supplier JCIS No.0 mouth and penetration midpoints. Existing ISO 4757 H0 wing/taper construction is used only as a simplified visual cavity, not as proof of JCIS/Phillips gauge equivalence.
