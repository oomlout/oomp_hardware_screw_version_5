schema_version: 1
standard: DIN 916 / ISO 4029
title: Cup-point hexagon socket set screws, sourced supplier dimensions
units: mm
head_style: headless
length_convention: overall
checked_on: '2026-10-11'
sources:
  - title: Bossard BN 27 cup-point set screw dimension table
    url: https://media.distrelec.com/Web/Downloads/_t/ds/1032143_eng_tds.pdf
    use: Point diameter ranges, key size and length-dependent socket depth for M1.6 through M6. Steel black reference dimensions, not a claim of product provenance.
  - title: Aspen Fasteners DIN 916 dimension table and figure
    url: https://www.aspenfasteners.com/content/pdf/Metric_DIN_916_spec.pdf
    use: Socket across-flats tolerance range, short depth for catalogue extensions and nominal 120 degree concave cup, 45 degree point bevel. M2 and M2.5 socket ranges are below the nominal key size in this source; the model uses the key size and flags this discrepancy rather than reproducing an undersize socket.
modelling_choices:
  point: Cup diameter uses the middle of the published dv range. A selected 0.025 mm radial annular land prevents a zero-width edge; the concavity uses a 120 degree cone.
  socket: Across flats uses the midpoint where the supplier range accommodates the key. For M2 and M2.5 it uses the nominal key because the supplier table is internally inconsistent.
  end: Socket-end face diameter uses the nominal external thread minor diameter with a 45 degree chamfer. Manufacturer marks and socket drill-tip detail are omitted.
