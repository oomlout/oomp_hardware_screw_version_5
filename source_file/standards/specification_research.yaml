schema_version: 1
units: mm
sources:
- &id001
  title: Tite-Fix Screw-Tite manufacturer technical table
  url: https://www.tite-fix.co.uk/product/screw-tite-multipurpose-screw/
  use: Exact diameter/length rows, head diameter limits, drive, thread coverage, material
    and finish. Does not specify pitch or Tri-Lock section.
- &id002
  title: Screwfix Screw-Tite 2 4 x 50, 127FY
  url: https://www.screwfix.com/p/screw-tite-2-pz-double-countersunk-thread-cutting-screws-4mm-x-50mm-200-pack/127fy
  use: User-preferred retailer; identifies double countersunk ribbed head, yellow
    Net-Coat, wax coating and single/twin thread.
- &id003
  title: Accu TFSTZ4050
  url: https://www.accu.co.uk/pozi-countersunk-wood-screws/771036-TFSTZ4050
  use: 'Separate zinc-plated 4 x 50 reference: D=7.8 +/-0.2, H=3.8, angle=90, PZ2,
    minimum thread length=28.5. Not assumed identical to Screw-Tite 2.'
- &id004
  title: User reference eBay 383102775525
  url: https://www.ebay.co.uk/itm/383102775525
  use: Phillips pan head, black-zinc carbon steel sheet-metal tapping screws. M2 and
    M2.3 listed; no dimension table in seller text.
- &id005
  title: User reference AliExpress 1005004774076999
  url: https://www.aliexpress.com/item/1005004774076999.html
  use: Could not retrieve the product page during this research; no dimensions inferred.
- &id006
  title: Screw Express micro plastic screw 1.4 x 5
  url: https://www.screw-express.com/micro-screw-self-tapping-pan-head-phillips-steel/61840-530259-self-tapping-screw-linch-pin-plastic-pan-head-phillips-0-14x5-black-zinc-plated-micro-screw.html
  use: 'Alternative plastic-screw candidate only: 1.4 pitch 0.5, 2 pitch 0.79, 2.3
    pitch 0.91; not a verified match to the sheet-metal listing.'
- &id007
  title: Japanese Screws supplier brochure, printed pages 6-7
  url: https://prokcssmedia.blob.core.windows.net/sys-master-images/h22/hd6/9138373263390/JAP%20SCREWS%20Brochure.pdf
  use: Different triangular thread types P, B and S have different pitches at the
    same diameter; these cannot identify the pointed sheet-metal product.
profiles:
  screw_tite:
    checked_on: '2026-10-12'
    sources:
    - *id001
    - *id002
    - *id003
    catalogue_drive: pozidriv
    catalogue_finish: yellow_zinc_plated
    known_specification:
      preferred_product: Screw-Tite from Screwfix
      head_style: double_countersunk_with_ribs
      thread_profile: Tri-Lock triangular core, single and twin thread zones
      material: hardened carbon steel
      reference_finish: Yellow CR3 / Screwfix Net-Coat yellow, wax-coated
    missing_specification:
    - Tri-Lock core section and diameters, flank profile, pitches/leads, and single/twin
      thread transition lengths
    - Point taper, dowel-ream geometry, head height/collar/ribs, and Stick-Tite recess
      dimensions
    - Confirm manufacturer table dimensions apply to the selected Screwfix Screw-Tite
      2 revision
    implementation_requirements:
    - Dedicated triangular-core, variable-start wood-thread and double-countersunk-head
      geometry; the metric machine-thread generator is not compatible.
    candidate_standards:
    - Tite-Fix Screw-Tite / Screw-Tite 2 proprietary supplier drawing
    notes:
    - This reference is not DIN 7997; do not combine DIN wood-thread dimensions with
      proprietary Screw-Tite dimensions.
    - The manufacturer table repeats SKU TFST04530 for 5 x 40; preserve the published
      value and flag it, rather than invent a replacement.
    - The manufacturer table reports 3.5 x 50 as Full and some 70 mm thread lengths
      shorter than 60 mm; preserve as published pending manufacturer verification.
    note: Product identity is narrowed to the user-preferred Screw-Tite range. Verified
      partial dimensions are recorded separately from model parameters; generation
      remains blocked on the proprietary geometry and catalogue conflicts.
