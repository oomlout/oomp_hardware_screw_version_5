  miniature_self_tapping:
    checked_on: '2026-10-12'
    sources:
    - *id004
    - *id005
    - *id006
    - *id007
    known_specification:
      head_style: pan
      drive_style: philips
      reference_finish: black zinc
      material: carbon steel
      application: sheet metal (seller description)
    missing_specification:
    - Exact supplier drawing for each diameter, including tapping pitch/lead and core
      profile
    - Head diameter/height, point/taper, threaded length and recess dimensions
    candidate_standards:
    - Exact miniature sheet-metal tapping supplier drawing
    implementation_requirements:
    - A dedicated non-metric tapping profile and point builder after dimensions are
      confirmed.
    notes:
    - Supplier M labels are diameter labels, not proof of a metric machine thread.
    - The alternative plastic screw dimensions are research leads, not selected geometry.
      At 1.4 mm the Japanese brochure lists Type P pitch 0.50 (or 0.61 special), B
      0.45 and S 0.30.
    note: Seller identity is retained. Alternative sourced tapping tables do not establish
      a match to the user-supplied product; no pitch or point has been guessed.
  miniature_m1_5:
    checked_on: '2026-10-12'
    sources:
    - title: Micro Fastenings countersunk machine screw range
      url: https://www.microfastenings.com/countersunk-phillips-machine-screws/
      use: Published range includes M1.4 and M1.6, but no M1.5 row.
    - title: PTS miniature countersunk range
      url: https://www.pts-uk.com/products/machine-screws/phillips-countersunk-machine-screws/metric-a2/a96501404h
      use: M1.4 dimensions available; cannot be interpolated into an M1.5 specification.
    missing_specification:
    - M1.5 supplier drawing confirming the thread pitch
    - M1.5 head diameter, height, angle, recess mouth and penetration limits
    candidate_standards:
    - M1.5 supplier-specific drawing
    notes:
    - No complete primary M1.5 dimensional drawing found in this research. M1.4/M1.6
      rows are not interpolated.
    note: 'M1.5 remains unresolved: obtain a supplier dimensioned drawing or measure
      a physical sample.'
