schema_version: 1
standard: Modern chipboard screw similar-product reference
title: Modern slim-shank Pozidriv chipboard/plywood screw visualization proxy
units: mm
head_style: countersunk
length_convention: overall
checked_on: '2026-10-13'
sources:
- title: HSB Chipboard Screw ETA-24/0222, Annex A page 11
  url: https://hsb-schrauben.de/wp-content/uploads/media/ETA240222-HSB-Chipboard-Screw-and-HSB-Wood-Construction-Screw.pdf
  use: Modern 3-6 mm chipboard screw core, slender shank, head diameter, head/neck
    clearance, pitch and 40 +/-3 degree flanks. Values transcribed from the archived
    PDF visual table; web text extraction mixes adjacent drawings. Nominal/midpoint
    selections below.
- title: Hebei Motu chipboard screw DIN 7505-A catalogue, printed page 03 (PDF page
    6)
  url: https://pub-mediabox-storage.rxweb-prd.com/exhibitor/document/exh-350e0970-c3e5-4252-b9da-5ebd0ff435aa/010dea8b-a20f-4303-98fa-753c89aa4363.pdf
  use: Modern Pozidriv recess width/depth and 2.5 mm head/core/wire diameter and pitch.
    Source offers full-thread short products; user requested partial threads, so its
    coverage schedule is not used. Archived as chipboard_exhibitor.pdf.
- title: Killich DIN 7998 wood thread table
  url: https://www.i-fasteners.com/thread-of-the-woodscrew
  use: 2/2.5 mm pitch fallback only. Small modern core/shank dimensions are explicit
    scaled extensions.
- title: Bossard BN 3333 DIN 965 A Pozidriv
  url: https://www.tme.eu/Document/b3c2bbb9412ad33d6d7c7272822eba01/BN3333-EN.pdf
  use: 2 mm similar-head Z1 recess only; not a chipboard or Screw-Tite gauge specification.
modelling_choices:
  identity: Modern chipboard/plywood screw proxy requested by user; slim shank with
    40 degree wood threads. Screw-Tite remains the preferred comparison; its exact
    Tri-Lock, ribs and twin-start transition are not reproduced.
  head: HSB nominal/midpoint head diameter and published head/neck clearance. Selected
    90 degree cone, 0.10d rim, small fillet and a slender cylindrical neck; head-to-thread
    clearance is shortened only on tiny catalogue extensions.
  thread: HSB modern chipboard core midpoints and nominal pitch, 40 degree flanks,
    selected 0.02P crest land. Plain shank uses published minimum diameter, independently
    of the thread crest.
  thread_coverage: User requests a bare section below every head. Target b=0.6L, capped
    at 72 mm, plus a one-pitch runout. Reserve a plain shank of at least min(0.5d,
    25% of available shaft), shortening the thread on tiny catalogue lengths. Coverage
    is an explicit visualization choice; actual Screw-Tite products vary.
  runout: Selected one-pitch fade into a smooth shank; limited to one third of the
    threaded envelope on very short entries.
  tip: Selected point length 1.25 diameters, shortened to 60% of the threaded envelope
    on short extensions. This approximates a plain sharp chipboard point; cutting
    flutes and serrations omitted.
  display: Smooth pointed thread envelope tapering into the slender plain shank; same
    recessed head.
  recess: Motu modern chipboard table supplies Pozidriv mouth and midpoint penetration
    at 2.5-6 mm; 2 mm retains the similar-head DIN 965 Z1 mouth/depth proxy. ISO 4757
    wing/taper visual cavity, not a gauge model.
  certification: Similar-product visualization only; does not identify the stocked
    product or certify DIN conformity.
  catalogue_length: Conservative extension label for every length; comparable dimension
    tables do not establish Screw-Tite stock availability.
  small_sizes: 2.5 mm head/core/shank/pitch use Motu dimensions (shank uses wire diameter).
    2 mm head/core/shank are scaled from 2.5 mm, with separately published 0.9 mm
    small wood-thread pitch and DIN 965 Z1 recess. Only the 2 mm profile is a scaled
    dimensional extension.
