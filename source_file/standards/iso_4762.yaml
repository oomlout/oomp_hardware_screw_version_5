schema_version: 1
standard: ISO 4762:2004
legacy_standard: DIN 912
title: Hexagon socket head cap screws
units: mm
checked_on: '2026-10-11'
head_style: cylindrical
length_convention: under_head
sources:
  - title: ISO 4762:2004, Figure 1 and Table 1, pages 2–5
    url: https://cdn.standards.iteh.ai/samples/34460/06335046afaf46fb8e84d91a3eda001d/ISO-4762-2004.pdf
    use: Plain head dk, k, s limits, minimum t/r, b, shank/grip table and standard length combinations.
  - title: ISO 4762 scope and current edition
    url: https://www.iso.org/standard/34460.html
    use: Coarse metric M1.6–M64; M2 and M2.5 are within scope.
  - title: Bossard BN 2052 fully threaded DIN 912 / ISO 4762 screws
    url: https://www.bossard.com/us-en/eshop/screws-and-bolts-with-internal-drive/hex-socket-head-cap-screws-fully-threaded/p/2052/
    use: Fully threaded commercial alternative; catalogue does not specify which threading option was purchased.
modelling_choices:
  head: Plain cylindrical head; no knurling or unidentified manufacturer/property-class stamps.
  edges: Permitted 45 degree edge chamfers, selected small values; circular countersink at socket mouth.
  socket: Across-flats midpoint of ISO limits; minimum penetration, permissible flat bottom.
  thread_coverage: ISO shank/grip table selects partial lengths; full-thread commercial alternatives can be selected with thread_coverage=full.
