  - title: Bossard BN 27 cup-point set screw dimension table
    url: https://media.distrelec.com/Web/Downloads/_t/ds/1032143_eng_tds.pdf
    use: Point diameter ranges, key size and length-dependent socket depth for M1.6
      through M6. Steel black reference dimensions, not a claim of product provenance.
  - title: Aspen Fasteners DIN 916 dimension table and figure
    url: https://www.aspenfasteners.com/content/pdf/Metric_DIN_916_spec.pdf
    use: Socket across-flats tolerance range, short depth for catalogue extensions
      and nominal 120 degree concave cup, 45 degree point bevel. M2 and M2.5 socket
      ranges are below the nominal key size in this source; the model uses the key
      size and flags this discrepancy rather than reproducing an undersize socket.
