    specifications: 'Thread Size: M6 (6mm); Length (Excluding Head): 45mm (Partially
      Threaded); M6 (6mm Thread Diameter) Socket Cap Screws, also known as Allen Bolts.
      Manufactured to DIN 912/ ISO 4762 in Self Colour High Tensile 12.9 Steel. Socket
      Cap Screws are perfect for applications where space is limited or where the
      screw head is installed in a recess due to the use of an allen key to tighten
      them. Ideal for use where there is not enough clearance to use a Hex Head Bolt.
      Suitable for applications where high strength is required due to the high tensile
      strength. These screws are partially threaded as standard after a certain length.
      Please note that these bolts offer little to no protection from rusting and
      are more suited for indoor use or for applications where they are protected
      from moisture.'
