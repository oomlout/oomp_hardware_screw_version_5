                text: "## READ THIS FIRST \u2014 no theme is coming in this message,\
                  \ and that is correct\n\nThis is **step 1 of 2**. It is deliberately\
                  \ theme-free. You are building a reusable house style, not designing\
                  \ a specific logo.\n\nThe theme arrives in step 2. Do **not** ask\
                  \ what the theme is. Do **not** ask any clarifying questions. Do\
                  \ **not** write a final image-generation prompt yet \u2014 you cannot,\
